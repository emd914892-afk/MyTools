<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MyTools - Tool 6</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root { --bg-color: #f8fafc; --card-bg: #ffffff; --text-color: #1e293b; --text-muted: #64748b; --primary: #10b981; --border-color: #e2e8f0; --shadow: 0 4px 6px -1px rgba(0,0,0,0.1); }
        [data-theme="dark"] { --bg-color: #0f172a; --card-bg: #1e293b; --text-color: #f8fafc; --text-muted: #94a3b8; --border-color: #334155; --shadow: 0 10px 25px rgba(0,0,0,0.3); }
        * { box-sizing: border-box; margin: 0; padding: 0; transition: background-color 0.3s, color 0.3s; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); min-height: 100vh; display: flex; flex-direction: column; }
        header { background-color: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; box-shadow: var(--shadow); }
        .header-left, .header-right { display: flex; align-items: center; gap: 15px; }
        .icon-btn { background: none; border: none; color: var(--text-color); font-size: 20px; cursor: pointer; padding: 8px; border-radius: 8px; }
        .icon-btn:hover { background-color: var(--border-color); }
        .brand-title { font-size: 20px; font-weight: bold; color: var(--primary); text-decoration: none; }
        .backdrop { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.5); opacity: 0; visibility: hidden; transition: all 0.3s ease; z-index: 200; }
        .backdrop.active { opacity: 1; visibility: visible; }
        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background-color: var(--card-bg); border-right: 1px solid var(--border-color); z-index: 201; transition: left 0.3s ease; display: flex; flex-direction: column; }
        .sidebar.active { left: 0; }
        .sidebar-header { padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .sidebar-menu { list-style: none; padding: 15px 10px; overflow-y: auto; }
        .sidebar-menu li { margin-bottom: 5px; }
        .nav-link { display: flex; align-items: center; gap: 12px; padding: 12px 15px; color: var(--text-color); text-decoration: none; border-radius: 8px; font-weight: 500; }
        .nav-link:hover, .nav-link.active { background-color: var(--primary); color: #ffffff; }
        main { flex: 1; padding: 25px 20px; max-width: 900px; width: 100%; margin: 0 auto; }
        .card { background-color: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 25px; box-shadow: var(--shadow); }
        .card h1 { font-size: 24px; margin-bottom: 10px; color: var(--primary); }
        .card p { color: var(--text-muted); line-height: 1.6; }
        footer { text-align: center; padding: 15px; border-top: 1px solid var(--border-color); color: var(--text-muted); font-size: 13px; }
    </style>
</head>
<body>
    <header>
        <div class="header-left">
            <button class="icon-btn" id="menuBtn"><i class="fa-solid fa-bars"></i></button>
            <a href="index.html" class="brand-title">MyTools</a>
        </div>
        <div class="header-right">
            <button class="icon-btn" id="themeBtn"><i class="fa-solid fa-moon" id="themeIcon"></i></button>
        </div>
    </header>

    <div class="backdrop" id="backdrop"></div>
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span class="brand-title">Navigation</span>
            <button class="icon-btn" id="closeBtn"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <ul class="sidebar-menu">
            <li><a href="index.html" class="nav-link"><i class="fa-solid fa-house"></i> Index (Home)</a></li>
            <li><a href="tool1.html" class="nav-link"><i class="fa-solid fa-wrench"></i> Tool 1</a></li>
            <li><a href="tool2.html" class="nav-link"><i class="fa-solid fa-gear"></i> Tool 2</a></li>
            <li><a href="tool3.html" class="nav-link"><i class="fa-solid fa-sliders"></i> Tool 3</a></li>
            <li><a href="tool4.html" class="nav-link"><i class="fa-solid fa-calculator"></i> Tool 4</a></li>
            <li><a href="tool5.html" class="nav-link"><i class="fa-solid fa-code"></i> Tool 5</a></li>
            <li><a href="tool6.html" class="nav-link active"><i class="fa-solid fa-terminal"></i> Tool 6</a></li>
            <li><a href="tool7.html" class="nav-link"><i class="fa-solid fa-folder"></i> Tool 7</a></li>
            <li><a href="tool8.html" class="nav-link"><i class="fa-solid fa-chart-simple"></i> Tool 8</a></li>
            <li><a href="tool9.html" class="nav-link"><i class="fa-solid fa-envelope"></i> Tool 9</a></li>
        </ul>
    </aside>

    <main>
        <div class="card">
            <h1>Tool 6 Page</h1>
            <p>This is the separate page for Tool 6. You can add your specific HTML/JS code here.</p>
        </div>
    </main>

    <footer>&copy; 2026 MyTools Platform. All rights reserved.</footer>

    <script>
        const menuBtn = document.getElementById('menuBtn');
        const closeBtn = document.getElementById('closeBtn');
        const backdrop = document.getElementById('backdrop');
        const sidebar = document.getElementById('sidebar');

        function openSidebar() { sidebar.classList.add('active'); backdrop.classList.add('active'); }
        function closeSidebar() { sidebar.classList.remove('active'); backdrop.classList.remove('active'); }

        menuBtn.addEventListener('click', openSidebar);
        closeBtn.addEventListener('click', closeSidebar);
        backdrop.addEventListener('click', closeSidebar);

        const themeBtn = document.getElementById('themeBtn');
        const themeIcon = document.getElementById('themeIcon');

        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.setAttribute('data-theme', 'dark');
                themeIcon.className = 'fa-solid fa-sun';
            } else {
                document.documentElement.removeAttribute('data-theme');
                themeIcon.className = 'fa-solid fa-moon';
            }
        }

        const savedTheme = localStorage.getItem('mytools_theme') || 'light';
        applyTheme(savedTheme);

        themeBtn.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
            localStorage.setItem('mytools_theme', newTheme);
            applyTheme(newTheme);
        });
    </script>
</body>
</html>
